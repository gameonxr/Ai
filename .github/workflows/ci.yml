name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt build setuptools wheel
      - name: Run tests with coverage
        run: python -m pytest -q --cov=simulator --cov=brain --cov=core --cov=body --cov=physics --cov=sensors --cov=actuators --cov=environment --cov=rendering --cov=training --cov=agents --cov=recording --cov=robot --cov=vector_env --cov-report=term-missing --cov-report=xml
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - name: Smoke test installed wheel
        run: |
          rm -rf /tmp/ai-wheel-test
          python -m pip install --target /tmp/ai-wheel-test --no-deps dist/*.whl
          cd /tmp
          rm -rf /tmp/ai-wheel-artifacts
          mkdir -p /tmp/ai-wheel-artifacts/evaluations
          PYTHONPATH=/tmp/ai-wheel-test python -m cli validate
          PYTHONPATH=/tmp/ai-wheel-test python -m cli health --config "$GITHUB_WORKSPACE/config/simulator_config.yaml" --json-out /tmp/ai-wheel-artifacts/health.json
          PYTHONPATH=/tmp/ai-wheel-test python -m cli benchmark --steps 2
          PYTHONPATH=/tmp/ai-wheel-test python -m cli evaluate --episodes 1 --max-steps 2 --json-out /tmp/ai-wheel-artifacts/evaluations/evaluation.json
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=/tmp/ai-wheel-test python -m cli sweep --cases config/sweep_cases.json --sweep-id ci-sweep --manifest-dir /tmp/ai-wheel-artifacts/runs --json-out /tmp/ai-wheel-artifacts/sweep.json
          PYTHONPATH=/tmp/ai-wheel-test python -m cli sweep --cases config/sweep_cases.json --sweep-id ci-sweep --manifest-dir /tmp/ai-wheel-artifacts/runs --resume
          PYTHONPATH=/tmp/ai-wheel-test python -m cli report --manifest-dir /tmp/ai-wheel-artifacts --json-out /tmp/ai-wheel-artifacts/report.json --strict
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
